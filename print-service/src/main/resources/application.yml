server:
  port: 8083

spring:
  application:
    name: print-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # A different group from the processing-service, so this service also receives every order
      group-id: print-service
      auto-offset-reset: earliest

app:
  kafka:
    orders-topic: pedidos

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Consumes orders from Kafka and prints them to the console
