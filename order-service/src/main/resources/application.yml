server:
  port: 8081

spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast when the broker is unreachable instead of blocking the HTTP request for a minute
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

app:
  kafka:
    send-timeout: 15s
    orders-topic:
      name: pedidos
      partitions: 3
      replication-factor: 1
  orders:
    # Quoted so YAML does not turn it into a float and drop the trailing zero
    max-total-amount: "50000.00"

resilience4j:
  circuitbreaker:
    instances:
      kafka-publisher:
        # Opens when at least half of the last 10 publishes failed (once 5 have been made)
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # Refuses orders for 10 s, then lets 3 trial publishes decide whether Kafka is back
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # An open circuit shows in /actuator/health without turning the service DOWN
        allow-health-indicator-to-fail: false

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Receives orders over REST and publishes them to Kafka
